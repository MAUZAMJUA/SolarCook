<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SolarCook - Nueva Solicitud de Mantenimiento</title>

    <link rel="stylesheet" href="solicitud-mantenimiento.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

    <div class="container">

        <!-- SIDEBAR -->

        <aside class="sidebar">

            <h2>☀ SolarCook</h2>

            <ul>
                <li>
                    <a href="../Dashboard/dashboard.html" style="color: inherit; text-decoration: none; display: block;">
                        <i class="fas fa-home"></i> Inicio
                    </a>
                </li>

                <li>
                    <a href="../Catalogo/listado-estufas.html" style="color: inherit; text-decoration: none; display: block;">
                        <i class="fas fa-fire"></i> Estufas
                    </a>
                </li>

                <li>
                    <a href="../Usuarios/usuarios.html" style="color: inherit; text-decoration: none; display: block;">
                        <i class="fas fa-users"></i> Usuarios
                    </a>
                </li>

                <li class="active">
                    <a href="mantenimiento.html" style="color: inherit; text-decoration: none; display: block;">
                        <i class="fas fa-tools"></i> Mantenimiento
                    </a>
                </li>

                <li>
                    <a href="../Reporte/reportes.html" style="color: inherit; text-decoration: none; display: block;">
                        <i class="fas fa-chart-bar"></i> Reportes
                    </a>
                </li>

                <li>
                    <a href="../Configuracion/configuracion.html" style="color: inherit; text-decoration: none; display: block;">
                        <i class="fas fa-cog"></i> Configuración
                    </a>
                </li>
            </ul>

        </aside>

        <!-- CONTENIDO -->

        <main class="content">

            <div class="header">

                <h1>
                    Nueva Solicitud de Mantenimiento
                </h1>

                <p>
                    Capture la información necesaria para generar una nueva solicitud de mantenimiento.
                </p>

            </div>

            <div class="card">

                <form class="formulario">

                    <div class="campo">
                        <label>Folio de Solicitud</label>
                        <input type="text" placeholder="MT-001">
                    </div>

                    <div class="campo">
                        <label>ID de Estufa</label>
                        <input type="text" placeholder="EST-001">
                    </div>

                    <div class="campo">
                        <label>Ubicación</label>
                        <input type="text" placeholder="Olimpo">
                    </div>

                    <div class="campo">
                        <label>Fecha de Solicitud</label>
                        <input type="date">
                    </div>

                    <div class="campo">
                        <label>Técnico Asignado</label>
                        <select>
                        <option>Seleccionar Técnico</option>
                        <option>María López</option>
                        <option>Carlos Ruiz</option>
                        <option>Ana Torres</option>
                    </select>
                    </div>

                    <div class="campo">
                        <label>Tipo de Mantenimiento</label>
                        <select>
                        <option>Seleccionar</option>
                        <option>Preventivo</option>
                        <option>Correctivo</option>
                        <option>Inspección General</option>
                    </select>
                    </div>

                    <div class="campo">
                        <label>Prioridad</label>
                        <select>
                        <option>Seleccionar</option>
                        <option>Baja</option>
                        <option>Media</option>
                        <option>Alta</option>
                    </select>
                    </div>

                    <div class="campo">
                        <label>Estado</label>
                        <select>
                        <option>Pendiente</option>
                        <option>En Proceso</option>
                        <option>Completado</option>
                    </select>
                    </div>

                    <div class="campo campo-completo">
                        <label>Descripción del Problema</label>

                        <textarea rows="5" placeholder="Describe el problema detectado en la estufa solar..."></textarea>
                    </div>

                    <div class="campo campo-completo">
                        <label>Observaciones</label>

                        <textarea rows="4" placeholder="Información adicional..."></textarea>
                    </div>

                    <div class="botones">

                        <button type="button" class="guardar">

                        <i class="fas fa-save"></i>
                        Generar Solicitud

                    </button>

                        <button type="reset" class="cancelar">

                        <i class="fas fa-times"></i>
                        Cancelar

                    </button>

                    </div>

                </form>

            </div>

        </main>

    </div>

</body>

</html>
