<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SolarCook - Nuevo Usuario</title>

    <link rel="stylesheet" href="nuevo-usuario.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

    <div class="container">

        <aside class="sidebar">

            <h2>☀ SolarCook</h2>

            <ul>
                <li><a href="../Dashboard/dashboard.html" style="color: inherit; text-decoration: none; display: block;"><i class="fas fa-home"></i> Inicio</a></li>
                <li><a href="../Catalogo/listado-estufas.html" style="color: inherit; text-decoration: none; display: block;"><i class="fas fa-fire"></i> Estufas</a></li>
                <li class="active"><a href="usuarios.html" style="color: inherit; text-decoration: none; display: block;"><i class="fas fa-users"></i> Usuarios</a></li>
                <li><a href="../Mantenimiento/mantenimiento.html" style="color: inherit; text-decoration: none; display: block;"><i class="fas fa-tools"></i> Mantenimiento</a></li>
                <li><a href="../Reporte/reportes.html" style="color: inherit; text-decoration: none; display: block;"><i class="fas fa-chart-bar"></i> Reportes</a></li>
                <li><a href="../Configuracion/configuracion.html" style="color: inherit; text-decoration: none; display: block;"><i class="fas fa-cog"></i> Configuración</a></li>
            </ul>

        </aside>

        <main class="content">

            <div class="header">
                <h1>Registrar Usuario</h1>
                <p>Captura los datos del nuevo usuario.</p>
            </div>

            <div class="card">

                <form class="formulario">

                    <div class="campo">
                        <label>Nombre Completo</label>
                        <input type="text">
                    </div>

                    <div class="campo">
                        <label>Correo Electrónico</label>
                        <input type="email">
                    </div>

                    <div class="campo">
                        <label>Teléfono</label>
                        <input type="text">
                    </div>

                    <div class="campo">
                        <label>Nombre de Usuario</label>
                        <input type="text">
                    </div>

                    <div class="campo">
                        <label>Contraseña</label>
                        <input type="password">
                    </div>

                    <div class="campo">
                        <label>Confirmar Contraseña</label>
                        <input type="password">
                    </div>

                    <div class="campo">
                        <label>Rol</label>
                        <select>
                        <option>Administrador</option>
                        <option>Técnico</option>
                        <option>Operador</option>
                    </select>
                    </div>

                    <div class="campo">
                        <label>Estado</label>
                        <select>
                        <option>Activo</option>
                        <option>Inactivo</option>
                    </select>
                    </div>

                    <div class="botones">
                        <button class="guardar">Guardar Usuario</button>
                        <button class="cancelar">Cancelar</button>
                    </div>

                </form>

            </div>

        </main>

    </div>

</body>

</html>
