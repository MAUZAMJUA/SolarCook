<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SolarCook Dashboard</title>
    <link rel="stylesheet" href="dashboard.css">
    <link rel="stylesheet" href="../../responsive.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

    <div class="page">

        <div class="sidebar" id="sidebar">

            <div class="logo">
                <h2>☀ SolarCook</h2>
            </div>

            <ul>
                <li class="active"><a href="dashboard.html" style="color: inherit; text-decoration: none; display: block;"><i class="fas fa-home"></i> Inicio</a></li>
                <li><a href="../Catalogo/listado-estufas.html" style="color: inherit; text-decoration: none; display: block;"><i class="fas fa-fire"></i> Estufas</a></li>
                <li><a href="../Usuarios/usuarios.html" style="color: inherit; text-decoration: none; display: block;"><i class="fas fa-users"></i> Usuarios</a></li>
                <li><a href="../Mantenimiento/mantenimiento.html" style="color: inherit; text-decoration: none; display: block;"><i class="fas fa-tools"></i> Mantenimiento</a></li>
                <li><a href="../Reporte/reportes.html" style="color: inherit; text-decoration: none; display: block;"><i class="fas fa-chart-bar"></i> Reportes</a></li>
                <li><a href="../Configuracion/configuracion.html" style="color: inherit; text-decoration: none; display: block;"><i class="fas fa-cog"></i> Configuración</a></li>
            </ul>

        </div>

        <div class="main-content">

            <header>
                <h1>Panel de Control</h1>

                <div class="user">
                    Administrador
                </div>
            </header>

            <section class="cards">

                <div class="card">
                    <i class="fas fa-fire"></i>
                    <h2>125</h2>
                    <p>Estufas Registradas</p>
                </div>

                <div class="card">
                    <i class="fas fa-check-circle"></i>
                    <h2>112</h2>
                    <p>Operativas</p>
                </div>

                <div class="card">
                    <i class="fas fa-wrench"></i>
                    <h2>13</h2>
                    <p>En Mantenimiento</p>
                </div>

                <div class="card">
                    <i class="fas fa-users"></i>
                    <h2>57</h2>
                    <p>Usuarios</p>
                </div>

            </section>

            <section class="quick-actions">

                <h2>Acciones Rápidas</h2>

                <div class="actions">

                    <div class="action-box">
                        <i class="fas fa-plus-circle"></i>
                        <h3>Registrar Estufa</h3>
                    </div>

                    <div class="action-box">
                        <i class="fas fa-user-plus"></i>
                        <h3>Nuevo Usuario</h3>
                    </div>

                    <div class="action-box">
                        <i class="fas fa-file-alt"></i>
                        <h3>Generar Reporte</h3>
                    </div>

                </div>

            </section>

        </div>


    </div>

</body>

</html>
